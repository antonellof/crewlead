# Add this to ~/.codex/config.toml

[mcp_servers.crewlead]
command = "node"
args = ["/absolute/path/to/crewlead/bin/crewlead.js", "mcp"]
# Without a clone:
# command = "npx"
# args = ["-y", "github:antonellof/crewlead", "mcp"]
startup_timeout_sec = 30
# delegate_batch returns when every worker is done. Give it room.
tool_timeout_sec = 1800

# Workers come from crewlead.config.json in the project, or from
# ~/.config/crewlead/config.json. Keys for remote providers stay in your
# shell environment (for example export OPENROUTER_API_KEY in ~/.zshrc).
# Do not write keys into this file.
