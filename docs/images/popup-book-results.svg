<svg xmlns="http://www.w3.org/2000/svg" width="900" height="376" viewBox="0 0 900 376" role="img" aria-label="Pop-up book benchmark. Lead output tokens in thousands: Fable alone 84.2, crew run 1 41.9, crew run 2 62.8, crew run 3 40.2, crew run 4 37.0. Wall time in minutes: 14.5, 57.5, 38.5, 76.2, 22.8.">
  <style>
