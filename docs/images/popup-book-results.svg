<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Pop-up book benchmark. Lead output tokens in thousands: Fable alone 84.2, crew run 1 41.9, crew run 2 62.8. Wall time in minutes: Fable alone 14.5, crew run 1 57.5, crew run 2 38.5.">
  <style>
    .surface { fill: #fcfcfb; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .axis { stroke: #b9b8b1; stroke-width: 1; }
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .solo { fill: #eb6834; }
    .crew { fill: #2a78d6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; }
    .v { font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .grid { stroke: #2e2d2b; }
      .axis { stroke: #4a4945; }
      .t1 { fill: #f0efec; }
      .t2 { fill: #c3c2b7; }
      .solo { fill: #d95926; }
      .crew { fill: #3987e5; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="900" height="300" rx="16"/>

  <!-- legend -->
  <rect class="solo" x="32" y="24" width="12" height="12" rx="3"/>
  <text class="t2 s" x="50" y="35">Fable 5.2 alone</text>
  <rect class="crew" x="170" y="24" width="12" height="12" rx="3"/>
  <text class="t2 s" x="188" y="35">Fable 5.2 lead + 3 local Qwen 3.8 27B workers (crewlead)</text>

  <!-- Panel 1: lead output tokens, as reported by the API. Scale: 230 px = 100k -->
  <text class="t1 h" x="32" y="78">Lead output tokens</text>
  <text class="t2 s" x="200" y="78">thousands, thinking included</text>
  <line class="grid" x1="237.5" y1="96" x2="237.5" y2="226"/>
  <line class="grid" x1="295" y1="96" x2="295" y2="226"/>
  <line class="grid" x1="352.5" y1="96" x2="352.5" y2="226"/>
  <line class="grid" x1="410" y1="96" x2="410" y2="226"/>
  <line class="axis" x1="180" y1="96" x2="180" y2="226"/>
  <text class="t2 s" x="170" y="121" text-anchor="end">Fable alone</text>
  <rect class="solo" x="180" y="104" width="193.6" height="24" rx="4"/>
  <text class="t1 v" x="381.6" y="121">84.2</text>
  <text class="t2 s" x="170" y="165" text-anchor="end">Crew, run 1</text>
  <rect class="crew" x="180" y="148" width="96.4" height="24" rx="4"/>
  <text class="t1 v" x="284.4" y="165">41.9</text>
  <text class="t2 s" x="170" y="209" text-anchor="end">Crew, run 2</text>
  <rect class="crew" x="180" y="192" width="144.4" height="24" rx="4"/>
  <text class="t1 v" x="332.4" y="209">62.8</text>
  <text class="t2 s" x="180" y="246" text-anchor="middle">0</text>
  <text class="t2 s" x="237.5" y="246" text-anchor="middle">25</text>
  <text class="t2 s" x="295" y="246" text-anchor="middle">50</text>
  <text class="t2 s" x="352.5" y="246" text-anchor="middle">75</text>
  <text class="t2 s" x="410" y="246" text-anchor="middle">100</text>

  <!-- Panel 2: wall time. Scale: 230 px = 60 min -->
  <text class="t1 h" x="482" y="78">Wall time</text>
  <text class="t2 s" x="566" y="78">minutes</text>
  <line class="grid" x1="706.7" y1="96" x2="706.7" y2="226"/>
  <line class="grid" x1="783.3" y1="96" x2="783.3" y2="226"/>
  <line class="grid" x1="860" y1="96" x2="860" y2="226"/>
  <line class="axis" x1="630" y1="96" x2="630" y2="226"/>
  <text class="t2 s" x="620" y="121" text-anchor="end">Fable alone</text>
  <rect class="solo" x="630" y="104" width="55.6" height="24" rx="4"/>
  <text class="t1 v" x="693.6" y="121">14.5</text>
  <text class="t2 s" x="620" y="165" text-anchor="end">Crew, run 1</text>
  <rect class="crew" x="630" y="148" width="220.4" height="24" rx="4"/>
  <text class="t1 v" x="800" y="165" text-anchor="end" style="fill:#ffffff">57.5</text>
  <text class="t2 s" x="620" y="209" text-anchor="end">Crew, run 2</text>
  <rect class="crew" x="630" y="192" width="147.6" height="24" rx="4"/>
  <text class="t1 v" x="785.6" y="209">38.5</text>
  <text class="t2 s" x="630" y="246" text-anchor="middle">0</text>
  <text class="t2 s" x="706.7" y="246" text-anchor="middle">20</text>
  <text class="t2 s" x="783.3" y="246" text-anchor="middle">40</text>
  <text class="t2 s" x="860" y="246" text-anchor="middle">60</text>

  <text class="t2 s" x="32" y="280">One run per bar. Tokens as reported by the API, time measured by bench/run.js. Run 2 adds the context and max_steps fixes.</text>
</svg>
