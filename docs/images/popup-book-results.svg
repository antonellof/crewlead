    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .solo { fill: #eb6834; }
    .crew { fill: #2a78d6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; }
    .v { font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .grid { stroke: #2e2d2b; }
      .axis { stroke: #4a4945; }
      .t1 { fill: #f0efec; }
      .t2 { fill: #c3c2b7; }
      .solo { fill: #d95926; }
      .crew { fill: #3987e5; }
