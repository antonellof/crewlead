<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="crewlead architecture: one lead model delegates to a pool of worker models">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 19px; font-weight: 700; }
      .sub { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .label { font-size: 13px; font-weight: 600; fill: #475569; }
      .back { font-size: 13px; font-weight: 600; fill: #059669; }
      .chip { font-size: 13px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="560" rx="18" fill="#f8fafc"/>

  <!-- Lead -->
  <rect x="200" y="28" width="500" height="92" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="62" text-anchor="middle" class="title">Lead model</text>
  <text x="450" y="86" text-anchor="middle" class="sub">Claude Code, Codex or Pi: plans, splits the work, reviews</text>
  <text x="450" y="106" text-anchor="middle" class="small">writes a contract and task list, never the code</text>

  <!-- lead to pool -->
  <line x1="390" y1="122" x2="390" y2="172" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="370" y="152" text-anchor="end" class="label">delegate_batch([A, B, C])</text>
  <line x1="510" y1="172" x2="510" y2="124" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowBack)"/>
  <text x="522" y="146" class="back">short reports, changed files,</text>
  <text x="522" y="163" class="back">verify results</text>

  <!-- Pool -->
  <rect x="150" y="176" width="600" height="84" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="450" y="208" text-anchor="middle" class="title">crewlead pool</text>
  <text x="450" y="232" text-anchor="middle" class="sub">concurrency cap per provider, fallback to another provider,</text>
  <text x="450" y="250" text-anchor="middle" class="sub">context compaction, step and shell limits</text>

  <!-- pool to workers -->
  <line x1="260" y1="262" x2="160" y2="304" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="262" x2="450" y2="304" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="262" x2="740" y2="304" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Workers -->
  <g>
    <rect x="40" y="308" width="240" height="100" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="70" cy="338" r="10" fill="#38bdf8"/>
    <text x="90" y="343" class="title">worker A</text>
    <text x="160" y="370" text-anchor="middle" class="small">read, edit, run</text>
    <text x="160" y="390" text-anchor="middle" class="small">verify, retry on failure</text>
  </g>
  <g>
    <rect x="330" y="308" width="240" height="100" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <circle cx="360" cy="338" r="10" fill="#34d399"/>
    <text x="380" y="343" class="title">worker B</text>
    <text x="450" y="370" text-anchor="middle" class="small">owns its files only</text>
    <text x="450" y="390" text-anchor="middle" class="small">verify, retry on failure</text>
  </g>
  <g>
    <rect x="620" y="308" width="240" height="100" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="650" cy="338" r="10" fill="#a78bfa"/>
    <text x="670" y="343" class="title">worker C</text>
    <text x="740" y="370" text-anchor="middle" class="small">retries are free</text>
    <text x="740" y="390" text-anchor="middle" class="small">on a local model</text>
  </g>

  <!-- workers to providers -->
  <line x1="160" y1="410" x2="160" y2="452" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="450" y1="410" x2="450" y2="452" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="740" y1="410" x2="740" y2="452" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Providers -->
  <rect x="40" y="454" width="820" height="80" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="480" text-anchor="middle" class="label">any OpenAI-compatible endpoint with tool calling, local or remote</text>
  <g>
    <rect x="62" y="494" width="110" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="117" y="513" text-anchor="middle" class="chip">llama.cpp</text>
    <rect x="184" y="494" width="90" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="229" y="513" text-anchor="middle" class="chip">MLX</text>
    <rect x="286" y="494" width="100" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="336" y="513" text-anchor="middle" class="chip">Ollama</text>
    <rect x="398" y="494" width="120" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="458" y="513" text-anchor="middle" class="chip">LM Studio</text>
    <rect x="530" y="494" width="80" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="570" y="513" text-anchor="middle" class="chip">vLLM</text>
    <rect x="622" y="494" width="120" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="682" y="513" text-anchor="middle" class="chip">OpenRouter</text>
    <rect x="754" y="494" width="84" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="796" y="513" text-anchor="middle" class="chip">any API</text>
  </g>
</svg>
